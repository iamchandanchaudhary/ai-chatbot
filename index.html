<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="jpeg/png" href="./src/assets/c2logo3.png">
    <title>AI ChatBot</title>

    <script>
        (() => {
            const stored = localStorage.getItem("chatbot-theme");
            const dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.classList.toggle("dark", dark);
        })();
    </script>

    <script src="./src/script.js" defer></script>

    <!-- Linking google fonts for the Inter typeface and the icon set -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link href="./output.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center min-h-screen w-full bg-slate-950">
    <div class="animated-bg fixed inset-0 -z-10 overflow-hidden bg-gradient-to-br from-slate-950 via-cyan-950 to-slate-900">
        <div class="absolute -left-[20vw] -top-[25vh] h-[85vh] w-[85vw] bg-glow-cyan animate-drift-one motion-reduce:animate-none will-change-transform"></div>
        <div class="absolute -right-[25vw] top-[20vh] h-[75vh] w-[75vw] bg-glow-teal animate-drift-two motion-reduce:animate-none will-change-transform"></div>
        <div class="absolute -bottom-[30vh] left-[15vw] h-[90vh] w-[90vw] bg-glow-sky animate-drift-three motion-reduce:animate-none will-change-transform"></div>
        <div class="absolute inset-0 bg-noise opacity-[0.045]"></div>
    </div>

    <!-- Chatbot -->
    <div class="chatbot-popup fixed w-full md:w-[70vw] xl:w-[60vw] h-full md:h-[600px] bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl overflow-hidden rounded-none md:rounded-xl shadow-2xl border-0 md:border-[1px] border-white/20 dark:border-white/10 animate-slide-up motion-reduce:animate-none transition-colors duration-300">

        <!-- Chatbot Header -->
        <div class="chat-header flex items-center justify-between bg-gradient-to-r from-sky-600 via-cyan-500 to-teal-500 dark:from-sky-900 dark:via-cyan-900 dark:to-teal-900 py-4 sm:py-5 px-5 sm:px-6 relative overflow-hidden transition-colors duration-300">
            <!-- Header glow effect -->
            <div class="absolute inset-0 bg-gradient-to-r from-cyan-300/20 to-teal-300/20 dark:from-cyan-400/10 dark:to-teal-400/10"></div>

            <div class="header-info flex gap-4 items-center relative z-10">
                <div class="relative">
                    <img src="./src/assets/botface.svg" alt="bot" class="chatbot-logo w-11 h-11 p-2 fill-cyan-600 bg-white flex-shrink-0 rounded-xl shadow-lg">
                    <span class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-green-400 border-2 border-white dark:border-slate-900 rounded-full animate-status-pulse motion-reduce:animate-none"></span>
                </div>
                <div class="flex flex-col">
                    <h2 class="logo-text text-white text-lg font-semibold tracking-tight">AI Chatbot</h2>
                    <span class="text-white/70 text-xs font-medium">Always here to help</span>
                </div>
            </div>

            <!-- Light/dark switch: repaints the chatbox only, never the page background -->
            <button type="button" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode" class="theme-toggle border-none text-white/90 h-10 w-10 flex items-center justify-center cursor-pointer rounded-xl hover:bg-white/10 hover:text-white active:scale-95 transition-all duration-300 ease-out relative z-10">
                <span class="material-symbols-outlined theme-icon text-2xl leading-none">dark_mode</span>
            </button>
        </div>

        <!-- Chatbot body -->
        <div class="chat-body py-6 px-4 sm:px-5 flex gap-4 h-[calc(100%-180px)] sm:h-[420px] overflow-y-auto flex-col">
            <!-- Welcome message -->
            <div class="message bot-message flex gap-3 items-end animate-message-in motion-reduce:animate-none">
                <div class="relative flex-shrink-0">
                    <img src="./src/assets/botavatar.svg" alt="bot" class="bot-avatar w-9 h-9 p-[6px] fill-white bg-gradient-to-br from-cyan-500 to-teal-600 rounded-full shadow-md">
                </div>
                <div class="message-text py-3 px-4 max-w-[80%] text-[0.9rem] leading-relaxed bg-gradient-to-br from-slate-50 to-cyan-50 dark:from-slate-800 dark:to-cyan-950 text-slate-700 dark:text-slate-100 rounded-2xl rounded-bl-md shadow-sm border border-cyan-100 dark:border-cyan-900/50 selection:bg-cyan-500/30 transition-colors duration-300">
                    Hey there! <span class="wave-emoji inline-block origin-[70%_70%] animate-wave motion-reduce:animate-none">👋</span><br/>
                    <span class="text-slate-500 dark:text-slate-400">How can I help you today?</span>
                </div>
            </div>
        </div>

        <!-- Chat footer -->
        <div class="chat-footer absolute bottom-0 w-full bg-gradient-to-t from-white via-white to-white/80 dark:from-slate-900 dark:via-slate-900 dark:to-slate-900/80 px-4 sm:px-5 pb-5 pt-4 flex backdrop-blur-sm transition-colors duration-300">
            <form action="#" class="chat-form relative w-full flex items-center bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-gray-200 dark:border-slate-700 focus-within:border-cyan-400 dark:focus-within:border-cyan-500 focus-within:ring-4 focus-within:ring-cyan-100 dark:focus-within:ring-cyan-500/20 focus-within:shadow-input-glow transition-all duration-300">

                <input type="text" placeholder="Type your message..." required class="message-input border-none outline-none h-14 w-full px-5 text-[15px] rounded-2xl bg-transparent text-slate-800 dark:text-slate-100 placeholder:text-gray-400 dark:placeholder:text-slate-500">

                <div class="chat-controls flex h-14 items-center pr-2 self-end gap-2">
                    <button type="button" id="emoji-picker" class="material-symbols-outlined h-10 w-10 border-none cursor-pointer text-gray-400 dark:text-slate-400 bg-none hover:bg-cyan-50 dark:hover:bg-cyan-500/10 hover:text-cyan-500 dark:hover:text-cyan-400 rounded-xl text-xl transition-all duration-200">sentiment_satisfied</button>

                    <div class="file-upload-wrapper w-10 h-10 relative">
                        <input type="file" accept="image/*" id="file-input" hidden>
                        <img src="#" alt="" class="uploaded-img absolute hidden w-full h-full object-cover rounded-xl border-2 border-cyan-500 [.file-uploaded_&]:block">
                        <button type="button" class="absolute w-10 h-10 flex items-center justify-center rounded-xl transition-all duration-200 [.file-uploaded_&]:hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" id="file-upload" class="h-5 w-5 border-none cursor-pointer fill-gray-400 dark:fill-slate-400 hover:fill-cyan-500 dark:hover:fill-cyan-400 transition-all duration-200" viewBox="0 -960 960 960"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm40-80h480L570-480 450-320l-90-120-120 160Zm-40 80v-560 560Z"/></svg>
                        </button>
                        <!-- Remove-image badge: only rendered once .file-uploaded is set on the wrapper -->
                        <button type="button" id="file-cancel" aria-label="Remove selected image" title="Remove image"
                            class="absolute -top-1.5 -right-1.5 hidden h-[18px] w-[18px] items-center justify-center rounded-full bg-slate-800/90 text-white ring-2 ring-white dark:bg-slate-950/90 dark:ring-slate-800 shadow-cancel hover:bg-rose-500 dark:hover:bg-rose-500 hover:scale-110 active:scale-95 transition-all duration-200 [.file-uploaded_&]:flex">
                            <span class="material-symbols-outlined text-[13px] leading-none">close</span>
                        </button>
                    </div>
                    <button type="submit" class="material-symbols-outlined send-message h-10 w-10 border-none cursor-pointer text-white bg-gradient-to-r from-cyan-500 to-teal-600 hover:from-cyan-600 hover:to-teal-700 dark:from-cyan-600 dark:to-teal-700 dark:hover:from-cyan-500 dark:hover:to-teal-600 rounded-full text-xl transition-all duration-300 shadow-md active:scale-95 motion-reduce:hover:animate-none">arrow_upward</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Linking Emoji Mart script for emoji picker -->
    <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>

</body>
</html>
